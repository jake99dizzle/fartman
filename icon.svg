  <rect x="238" y="316" width="36" height="32" rx="4" fill="#ffe600"/>
  <rect x="246" y="322" width="20" height="20" rx="3" fill="#ff6b00"/>

  <!-- Cape -->
  <path d="M182 240 Q140 300 160 380 L182 360 Z" fill="#cc2222"/>
  <path d="M330 240 Q372 300 352 380 L330 360 Z" fill="#cc2222"/>

  <!-- Head -->
  <ellipse cx="256" cy="195" rx="58" ry="62" fill="#ffcc88"/>
