  <path d="M232 212 Q256 228 280 212" stroke="#884422" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Ears -->
  <ellipse cx="198" cy="200" rx="12" ry="16" fill="#ffcc88"/>
  <ellipse cx="314" cy="200" rx="12" ry="16" fill="#ffcc88"/>
