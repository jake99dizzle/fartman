  <rect x="200" y="348" width="46" height="80" rx="12" fill="#1133aa"/>
  <rect x="266" y="348" width="46" height="80" rx="12" fill="#1133aa"/>
  <!-- Boots -->
  <rect x="196" y="410" width="54" height="30" rx="10" fill="#cc2222"/>
  <rect x="262" y="410" width="54" height="30" rx="10" fill="#cc2222"/>

  <!-- FART CLOUD from behind (right side) -->
  <ellipse cx="365" cy="330" rx="42" ry="32" fill="#88dd44" opacity="0.9"/>
  <ellipse cx="395" cy="318" rx="28" ry="22" fill="#88dd44" opacity="0.85"/>
  <ellipse cx="418" cy="330" rx="22" ry="18" fill="#88dd44" opacity="0.8"/>
  <ellipse cx="440" cy="325" rx="18" ry="14" fill="#88dd44" opacity="0.7"/>
  <ellipse cx="378" cy="312" rx="20" ry="16" fill="#ccff88" opacity="0.7"/>
  <!-- Cloud highlight -->
  <ellipse cx="372" cy="322" rx="16" ry="11" fill="#ccff88" opacity="0.5"/>

  <!-- Wavy fart lines -->
  <path d="M458 310 Q470 305 465 315 Q475 310 468 322" stroke="#66cc22" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M462 330 Q476 325 470 338 Q480 333 474 345" stroke="#66cc22" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Title text — drawn as shapes -->
  <!-- F -->
  <rect x="68" y="60" width="10" height="52" fill="#ffe600"/>
  <rect x="68" y="60" width="34" height="10" fill="#ffe600"/>
  <rect x="68" y="82" width="26" height="9" fill="#ffe600"/>
  <!-- A -->
  <polygon points="110,112 126,60 142,112" fill="#ffe600"/>
  <rect x="114" y="90" width="24" height="9" fill="#1a0a2e"/>
  <!-- R -->
  <rect x="150" y="60" width="10" height="52" fill="#ffe600"/>
  <rect x="150" y="60" width="28" height="10" fill="#ffe600"/>
  <rect x="150" y="80" width="28" height="9" fill="#ffe600"/>
  <rect x="168" y="60" width="10" height="22" rx="5" fill="#ffe600"/>
  <polygon points="168,89 178,112 160,112" fill="#ffe600"/>
  <!-- T -->
  <rect x="190" y="60" width="36" height="10" fill="#ffe600"/>
  <rect x="203" y="60" width="10" height="52" fill="#ffe600"/>

  <!-- MAN below -->
  <!-- M -->
  <rect x="148" y="126" width="9" height="44" fill="#7dff6b"/>
  <rect x="157" y="126" width="9" height="22" fill="#7dff6b"/>
  <polygon points="148,126 166,148 184,126" fill="#7dff6b"/>
  <rect x="175" y="126" width="9" height="44" fill="#7dff6b"/>
  <!-- A -->
  <polygon points="196,170 210,126 224,170" fill="#7dff6b"/>
  <rect x="200" y="152" width="20" height="8" fill="#1a0a2e"/>
  <!-- N -->
  <rect x="234" y="126" width="9" height="44" fill="#7dff6b"/>
  <polygon points="234,126 234,135 268,170 268,161" fill="#7dff6b"/>
  <rect x="259" y="126" width="9" height="44" fill="#7dff6b"/>
