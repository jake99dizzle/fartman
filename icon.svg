  <path d="M210 168 Q220 148 256 145 Q292 148 302 168 Q280 160 256 160 Q232 160 210 168 Z" fill="#2244cc"/>

  <!-- Arms -->
  <ellipse cx="170" cy="275" rx="22" ry="50" fill="#2244cc"/>
  <ellipse cx="342" cy="275" rx="22" ry="50" fill="#2244cc"/>
  <!-- Hands -->
  <ellipse cx="170" cy="322" rx="20" ry="22" fill="#ffcc88"/>
  <ellipse cx="342" cy="322" rx="20" ry="22" fill="#ffcc88"/>

